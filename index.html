const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:N,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},k,d(C));
 return new TextDecoder().decode(pt);
}
async function go(pw){
 const b=document.getElementById('b'),e=document.getElementById('e');
 b.disabled=true;b.textContent='Wird entschlüsselt …';e.textContent='';
 try{const h=await open_(pw);try{sessionStorage.setItem('k',pw)}catch(_){}
  document.open();document.write(h);document.close();}
 catch(_){b.disabled=false;b.textContent='Öffnen';e.textContent='Passwort falsch.';try{sessionStorage.removeItem('k')}catch(_){}}
}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();go(document.getElementById('pw').value.trim())});
try{const s=sessionStorage.getItem('k');if(s)go(s)}catch(_){}
})();
